# GitHub Pages builds this with Jekyll on every push (.github/workflows/pages.yml).
# Content lives in _data/ and _work/ and is edited through /admin (Sveltia CMS, admin/config.yml).
#
# `url` and `baseurl` are filled in automatically on GitHub Pages. Set them only for a custom setup,
# e.g.  url: https://example.com  and  baseurl: ""
title: Portfolio

# Bump when anything in assets/css or assets/js changes so browsers fetch the new files.
asset_version: 3

collections:
  work:
    output: true
    permalink: /work/:name.html

defaults:
  - scope:
      path: ""
      type: work
    values:
      layout: work

exclude:
  - _tools
  - README.md
  - LICENSE
  - docs
