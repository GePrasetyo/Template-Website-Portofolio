{%- comment -%} Showcase theme: header, page content, footer. {%- endcomment -%}
<header class="nav">
  <div class="wrap">
    <a class="brand" href="{{ '/' | relative_url }}">{{ full_name | escape }}</a>
    {% include nav.html %}
  </div>
</header>

{{ content }}

<footer class="footer">
  <div class="wrap">
    <span>© {{ site.time | date: '%Y' }} {{ full_name | escape }}</span>
    {%- if profile.tagline %}
    <span>{{ profile.tagline | escape }}</span>
    {%- endif %}
  </div>
</footer>
