{%- comment -%}
  Road Trip theme: the landscape and the car, behind the home page's drive and the project page's
  header. Each layer slides by --p (see roadtrip.css). Include it once per page: the car's
  headlight gradient id must be unique.
{%- endcomment -%}
<div class="scenery" aria-hidden="true">
  <div class="layer stars"></div>
  <div class="layer clouds"></div>
  <div class="orb"></div>
  <div class="layer far"></div>
  <div class="layer hills"></div>
  <div class="layer verge"></div>
  <div class="layer road"></div>
  <div class="car">
    <svg viewBox="0 0 200 96">
      <defs><linearGradient id="rt-beam" x1="0" y1="0" x2="1" y2="0"><stop class="b0" offset="0"/><stop class="b1" offset="1"/></linearGradient></defs>
      <ellipse class="shadow" cx="104" cy="92" rx="88" ry="5"/>
      <polygon class="beam" points="192,57 640,14 640,104 192,67"/>
      <circle class="puff" cx="10" cy="74" r="6"/><circle class="puff two" cx="10" cy="74" r="6"/><circle class="puff three" cx="10" cy="74" r="6"/>
      <g class="chassis">
        <path class="body" d="M194 70C196 58 190 50 178 48L150 44L128 22C122 16 116 14 106 14L72 14C62 14 56 18 50 26L36 44C22 46 13 52 13 62L13 70C13 75 17 78 22 78L188 78C192 78 194 75 194 70Z"/>
        <path class="win" d="M142 46L122 25C119 22 116 21 111 21L96 21L96 46Z"/><path class="win" d="M88 21L72 21C66 21 62 23 58 28L45 46L88 46Z"/>
        <rect class="trim" x="91.5" y="48" width="2.5" height="26" rx="1"/><rect class="trim" x="100" y="54" width="12" height="3" rx="1.5"/><rect class="trim" x="56" y="54" width="12" height="3" rx="1.5"/>
        <rect class="lamp" x="188" y="51" width="6" height="9" rx="2"/><rect class="tail" x="14" y="51" width="9" height="7" rx="2"/>
        <rect class="trim" x="11" y="70" width="186" height="5" rx="2.5"/>
      </g>
      <g class="wheel"><circle class="tyre" cx="52" cy="78" r="17"/><circle class="rim" cx="52" cy="78" r="9"/><line class="spoke" x1="45" y1="78" x2="59" y2="78"/><line class="spoke" x1="52" y1="71" x2="52" y2="85"/></g>
      <g class="wheel"><circle class="tyre" cx="156" cy="78" r="17"/><circle class="rim" cx="156" cy="78" r="9"/><line class="spoke" x1="149" y1="78" x2="163" y2="78"/><line class="spoke" x1="156" y1="71" x2="156" y2="85"/></g>
    </svg>
  </div>
  <div class="layer front"></div>
</div>
