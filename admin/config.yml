# Sveltia CMS: https://sveltiacms.app/en/docs
# Open <your site>/admin/ and choose "Sign In with Token". Use a fine-grained GitHub token scoped to
# this repository only, with Contents: Read and write. The public site needs no login.
#
# Uploads are stills only: every image field accepts jpg/png/webp/avif up to 5 MB, and video is
# always a YouTube link. The asset library itself cannot be restricted by type, so
# .github/workflows/pages.yml refuses to deploy if anything else lands under assets/.
#
# The people editing this are not developers. Labels say what a field is on the page, and every
# field that isn't obvious has a hint. Hints are rendered as Markdown, so show literal syntax in
# `backticks`. The picture guide linked from the Look & feel hints is admin/looks.html.
#
# Content never says how it looks: the theme chosen under Look & feel lays it out. Project pages are
# sections of items (see _includes/item.html); the theme, palette and font options below must match
# the keys in _data/themes.yml, _data/palettes.yml and _data/fonts.yml.
#
# 3D models are a pasted Sketchfab link / embed code or ArtStation embed code; _includes/model.html
# pulls the model ID out of it. The pattern below must accept exactly what that include can parse.

# On <user>.github.io/<repo>/admin/, admin/index.html fills in backend.repo, site_url and
# display_url from the address, so a fork works without editing this file. On a custom domain,
# set them here.
backend:
  name: github
  repo: your-username/your-repo
  branch: main
  auth_methods: [token]

app_title: Portfolio Admin
logo:
  src: ../favicon.svg

media_folder: /assets/img
public_folder: /assets/img
media_libraries:
  default:
    config:
      max_file_size: 5242880
      slugify_filename: true

# Leave empty optional fields out of the saved files, so the templates can simply test whether a
# field is there.
output:
  omit_empty_optional_fields: true

singletons:

  # ------------------------------------------------------------------ look & feel
  - name: look
    label: Look & feel
    icon: palette
    file: _data/look.yml
    fields:
      - name: theme
        label: Theme
        widget: select
        default: comic
        options:
          - { label: "Comic: slanted comic-book boxes, bold and playful", value: comic }
          - { label: "Showcase: big pictures and videos, few words, dark", value: showcase }
          - { label: "Editorial: large type and lots of space, like a magazine", value: editorial }
        hint: "How your whole site is laid out. Your words, pictures and videos stay the same when you switch. [See what each theme looks like](looks.html)"
      - name: palette
        label: Colours
        widget: select
        default: theme
        dropdown_threshold: 10
        options:
          - { label: "The theme's own", value: theme }
          - { label: "Cobalt: off-white and blue", value: cobalt }
          - { label: "Night: near-black and lime", value: night }
          - { label: "Paper: warm white and red", value: paper }
          - { label: "Forest: green", value: forest }
          - { label: "Tangerine: orange", value: tangerine }
          - { label: "Plum: purple", value: plum }
          - { label: "Black and white", value: mono }
          - { label: "My own colours (below)", value: custom }
        hint: "Every set has a light and a dark version. [See all the colours](looks.html#colours)"
      - name: custom
        label: My own colours
        widget: object
        collapsed: true
        summary: "{{fields.background}} · {{fields.text}} · {{fields.accent}}"
        hint: "Only used when Colours is set to My own colours."
        fields:
          - { name: background, label: Background, widget: color, default: "#F4F2EC" }
          - { name: text, label: Text, widget: color, default: "#15151A", hint: &text_colour_hint Pick one that is easy to read on the background. }
          - { name: accent, label: Accent, widget: color, default: "#2648D1", hint: &accent_hint "For highlights such as labels, buttons and links. Pick one that stands out against the background." }
      - name: custom_dark
        label: My own colours for dark mode (optional)
        widget: object
        collapsed: true
        summary: "{{fields.background}} · {{fields.text}} · {{fields.accent}}"
        required: false
        hint: "Add these to give your own colours a dark version as well. Without them, everyone sees the colours above."
        fields:
          - { name: background, label: Background, widget: color, default: "#141417" }
          - { name: text, label: Text, widget: color, default: "#ECEBE6", hint: *text_colour_hint }
          - { name: accent, label: Accent, widget: color, default: "#7590FF", hint: *accent_hint }
      - name: fonts
        label: Fonts
        widget: select
        default: theme
        dropdown_threshold: 10
        options:
          - { label: "The theme's own", value: theme }
          - { label: "Bold: Archivo and IBM Plex Sans", value: grotesk }
          - { label: "Modern: Space Grotesk and Inter", value: modern }
          - { label: "Classic: Fraunces (serif) and Inter", value: serif }
          - { label: "Code: JetBrains Mono and Inter", value: mono }
          - { label: "My own Google Fonts (below)", value: google }
        hint: "[See the fonts](looks.html#fonts)"
      - name: google_fonts
        label: My own Google Fonts (optional)
        widget: text
        required: false
        pattern: ['fonts\.googleapis\.com/css2\?', "This isn't a Google Fonts link. On fonts.google.com, pick your fonts, click Get embed code and copy the code."]
        hint: "Only used when Fonts is set to My own Google Fonts. On [fonts.google.com](https://fonts.google.com), add one or two fonts to your selection, click **Get embed code**, copy the code and paste all of it here. The first font is for headings, the second for the rest of the text. With one font, it's used for both."
      - name: mode
        label: Light and dark
        widget: select
        default: auto
        options:
          - { label: "Follow the visitor's device, with a switch", value: auto }
          - { label: Always light, value: light }
          - { label: Always dark, value: dark }
        hint: "Phones and computers can be set to dark mode. The first option matches that and adds a button so visitors can switch."

collections:

  # ------------------------------------------------------------------ work pages
  - name: work
    label: Projects
    label_singular: Project
    icon: work
    description: Each project gets its own page and a card in the Work section of your home page. Click New to add one.
    folder: _work
    extension: md
    format: yaml-frontmatter
    create: true
    delete: true
    slug: "{{slug}}"
    identifier_field: title
    summary: "{{order}}. {{title}}"
    sortable_fields:
      fields: [order, title]
      default: { field: order, direction: ascending }
    thumbnail: image
    preview_path: "work/{{slug}}.html"
    fields:
      - { name: title, label: Project name, hint: The big heading on the project page and the name on its home page card. }
      - name: order
        label: Order
        widget: number
        value_type: int
        min: 1
        hint: "1 comes first. This sets the order of the cards on your home page, and where the Previous / Next buttons at the bottom of each project page go."
      - { name: published, label: Show on site, widget: boolean, default: true, required: false, hint: Switch off to hide this project without deleting it. }
      - { name: dates, label: Dates (optional), required: false, hint: "e.g. 2024 – present. Shown on the project page and its home page card." }
      - { name: role, label: Your role (optional), required: false, hint: "e.g. Lead Developer. Shown next to the dates." }
      - { name: summary, label: One-line summary (optional), required: false, hint: "Shown under the project name on its home page card, e.g. Multiplayer racing game · Unity · PC" }
      - name: image
        label: Main picture
        widget: image
        accept: image/jpeg,image/png,image/webp,image/avif
        choose_url: false
        hint: "Shown on this project's card on the home page, and as the preview picture when someone shares the link. A wide (landscape) picture, about 1600 px across, works best."
      - name: image_alt
        label: Main picture description
        hint: &alt_hint "A few words about what the picture shows, e.g. Key art of a car racing through a city. Blind visitors hear this read aloud, and it appears if the picture can't load."
      - { name: highlight, label: Highlight, widget: boolean, default: false, required: false, hint: "Makes this project stand out on your home page, e.g. with a bigger card. Use it for your one or two best projects." }
      - name: description
        label: Share description
        widget: text
        hint: &share_hint "One sentence. Google shows it in search results, and WhatsApp, LinkedIn or Slack show it under the link when someone shares this page."
      - name: intro
        label: Intro (optional)
        widget: text
        required: false
        hint: "A few sentences under the project name. Formatting: `**two stars**` for **bold**, `*one star*` for *italic*, `[words](https://…)` for a link."
      - name: facts
        label: Quick facts
        label_singular: Fact
        widget: list
        required: false
        summary: "{{fields.label}}: {{fields.value}}"
        hint: "Optional. Short label and value pairs shown under the intro, e.g. Engine: Unity."
        fields:
          - { name: label, label: Label, hint: "e.g. Studio, Engine, Platforms" }
          - { name: value, label: Value, hint: "e.g. Unity · C#" }
      - name: buttons
        label: Buttons (optional)
        widget: object
        required: false
        collapsed: auto
        hint: "Links shown under the intro, e.g. to where people can get the game."
        fields:
          - &buttons_label { name: label, label: Small label (optional), required: false, hint: "Shown before the buttons, e.g. Get the game" }
          - &web_links
            name: links
            label: Buttons
            label_singular: Button
            widget: list
            summary: "{{fields.label}}"
            fields:
              - { name: label, label: Button text, hint: "e.g. Steam" }
              -
                name: url
                label: Web address
                pattern: ['^https?://', 'Must start with https://']
                hint: "Copy it from your browser's address bar. It starts with https://"
      - name: sections
        label: Page sections
        label_singular: Section
        widget: list
        required: false
        collapsed: true
        summary: "Section · {{fields.heading}}"
        hint: "The rest of the project page. A section has an optional heading and a number of columns, and holds items: text, pictures, videos, 3D models, cards (e.g. awards), lists and buttons. Click **Add Section**, then **Add Item** inside it. Drag the ═ handle to change the order."
        fields:
          - { name: label, label: Small label (optional), required: false, hint: "Shown above the heading, e.g. 2018–2020 · Studio name, City" }
          - { name: heading, label: Heading (optional), required: false }
          - { name: intro, label: Intro (optional), required: false, hint: One line shown next to the heading. }
          - name: columns
            label: Columns
            widget: select
            default: 1
            options:
              - { label: "1: every item gets a whole row", value: 1 }
              - { label: "2 side by side", value: 2 }
              - { label: "3 side by side", value: 3 }
            hint: "How many items sit next to each other. Items fill each row from left to right, then start a new row. On phones they stack."
          - name: items
            label: Items
            label_singular: Item
            widget: list
            collapsed: auto
            types:

              - name: text
                label: Text
                widget: object
                summary: "Text · {{fields.heading}}"
                fields:
                  - { name: heading, label: Heading (optional), required: false, hint: "Some themes number headings (01, 02…) for you." }
                  - name: body
                    label: Text
                    widget: richtext
                    modes: [rich_text]
                    buttons: [bold, italic, link, bulleted-list, numbered-list]
                    editor_components: []
                    hint: "Use the toolbar for bold, italic, links and bullet points."
                  - &width
                    name: width
                    label: Width (optional)
                    widget: select
                    required: false
                    options:
                      - { label: "Wide (two columns)", value: wide }
                      - { label: Whole row, value: full }
                    hint: "Leave it on (None) for one column. Only matters when the section has 2 or 3 columns, e.g. in 3 columns a Wide item next to a normal one fills the row."

              - name: picture
                label: Picture
                widget: object
                summary: "Picture · {{fields.caption}}"
                fields:
                  - name: image
                    label: Picture
                    widget: image
                    accept: image/jpeg,image/png,image/webp,image/avif
                    choose_url: false
                  - { name: alt, label: Picture description, hint: *alt_hint }
                  - { name: label, label: Small label (optional), required: false, hint: "e.g. Lobby · UI" }
                  - { name: caption, label: Caption (optional), required: false, hint: "A few words about the picture, e.g. Game one." }
                  - { name: contain, label: Show the whole picture, widget: boolean, default: false, required: false, hint: "Pictures are normally cropped to fill their space. Switch this on for tall pictures, such as phone screenshots, so nothing gets cut off." }
                  - *width

              - name: video
                label: Video
                widget: object
                summary: "Video · {{fields.title}}"
                fields:
                  - name: youtube
                    label: YouTube link
                    hint: "Upload the video to YouTube first (Unlisted is fine), then copy its link from your browser and paste it here. Video files can't be uploaded to this site."
                    pattern: ['^\s*((https?://)?(www\.|m\.)?(youtube\.com/(watch\?(.*&)?v=|shorts/|embed/|live/)|youtu\.be/)[\w-]{11}\S*|[\w-]{11})\s*$', 'Must be a YouTube link, e.g. https://www.youtube.com/watch?v=…']
                  - { name: title, label: Video title, hint: "What the video is, e.g. Launch trailer. Blind visitors hear this read aloud." }
                  - { name: label, label: Small label (optional), required: false, hint: "e.g. Official trailer" }
                  - { name: play, label: Play button text (optional), required: false, hint: "Leave empty for Play." }
                  - name: cover
                    label: Cover picture (optional)
                    widget: image
                    required: false
                    accept: image/jpeg,image/png,image/webp,image/avif
                    choose_url: false
                    hint: Shown before the video plays. Leave empty to use the one from YouTube.
                  - { name: cover_alt, label: Cover picture description (optional), required: false, hint: Leave empty to use the video title. }
                  - *width

              - name: model
                label: 3D model
                widget: object
                summary: "3D model · {{fields.title}}"
                fields:
                  - name: model
                    label: Sketchfab or ArtStation link
                    widget: text
                    hint: "**Sketchfab:** open the model on sketchfab.com and copy the link from your browser's address bar. **ArtStation:** open your artwork, copy the embed code under the 3D viewer and paste all of it here. The artwork's page link on its own won't work. Sketchfab tends to load more reliably for visitors."
                    pattern: ['(sketchfab\.com/(3d-models/[^\s"''?#/]*-|models/)[0-9a-f]{32}|artstation\.com/embed/\d+)', "This isn't a Sketchfab model link or an ArtStation embed code. For ArtStation, copy the embed code under the 3D viewer, not the page link."]
                  - { name: title, label: Model title, hint: "What the model is, e.g. Hero character, game-ready. Blind visitors hear this read aloud." }
                  - *width

              - name: card
                label: Card (e.g. an award)
                widget: object
                summary: "Card · {{fields.title}}"
                fields:
                  - { name: label, label: Small label (optional), required: false, hint: "Highlighted, e.g. Winner or Best Game. Only shown when there's no logo." }
                  - name: logo
                    label: Logo (optional)
                    widget: image
                    required: false
                    accept: image/jpeg,image/png,image/webp,image/avif
                    choose_url: false
                    hint: Shown instead of the small label. A black logo on a see-through background (PNG) works best. It turns white automatically in dark mode.
                  - { name: logo_alt, label: Logo description, required: false, hint: "The name of the award or organiser, for blind visitors." }
                  - { name: title, label: Title, hint: "e.g. the award's name" }
                  - { name: text, label: Details (optional), required: false, hint: "e.g. 2025 · Best Multiplayer" }
                  - *width

              - name: list
                label: List (e.g. quick facts)
                widget: object
                summary: "List · {{fields.heading}}"
                fields:
                  - &list_heading { name: heading, label: Heading (optional), required: false, hint: "e.g. Recognition or Quick facts" }
                  - &list_rows
                    name: rows
                    label: Rows
                    label_singular: Row
                    widget: list
                    summary: "{{fields.label}} · {{fields.title}}"
                    hint: "A row is a small label with a title and details, e.g. Winner · Award name · Project One. Or leave the title empty for a label and text, e.g. Location · City, Country."
                    fields:
                      - { name: label, label: Small label, hint: "e.g. Winner, or Location" }
                      - { name: highlight, label: Highlight the label, widget: boolean, default: false, required: false, hint: Only for rows with a title. }
                      - { name: title, label: Title (optional), required: false, hint: "e.g. the award's name" }
                      - { name: text, label: Details (optional), widget: text, required: false, hint: &fmt_short "Formatting: `**two stars**` for **bold**, `*one star*` for *italic*, `[words](https://…)` for a link." }
                  - *width

              - name: buttons
                label: Buttons (links)
                widget: object
                summary: "Buttons · {{fields.label}}"
                fields:
                  - *buttons_label
                  - *web_links
                  - *width

  # ------------------------------------------------------------------ home page
  - name: home
    label: Home page
    icon: home
    description: Your main page, one part at a time, in order from top to bottom. The project cards come from Projects.
    files:

      - name: welcome
        label: Welcome screen (optional)
        icon: door_open
        file: _data/home/welcome.yml
        fields:
          - { name: show, label: Show a welcome screen, widget: boolean, default: false, required: false, hint: "A full-screen first view of your home page with your name and one button. Visitors click the button to see your site. It only shows once per visit, and not to people coming back from a project page." }
          - name: background
            label: Background
            widget: select
            default: picture
            options:
              - { label: A colour, value: colour }
              - { label: A picture, value: picture }
              - { label: A YouTube video, value: video }
              - { label: A 3D model (Sketchfab or ArtStation), value: model }
          - { name: colour, label: Colour (optional), widget: color, required: false, hint: "For the colour background. Leave empty to use your site's background colour." }
          - name: picture
            label: Picture (optional)
            widget: image
            required: false
            accept: image/jpeg,image/png,image/webp,image/avif
            choose_url: false
            hint: "For the picture background. With a video or 3D model it's shown while they load, and on phones instead of them. A wide (landscape) picture works best."
          - name: youtube
            label: YouTube link (optional)
            required: false
            hint: "For the video background. It plays without sound, over and over, and can't be clicked. Copy the link from your browser."
            pattern: ['^\s*((https?://)?(www\.|m\.)?(youtube\.com/(watch\?(.*&)?v=|shorts/|embed/|live/)|youtu\.be/)[\w-]{11}\S*|[\w-]{11})\s*$', 'Must be a YouTube link, e.g. https://www.youtube.com/watch?v=…']
          - name: model
            label: Sketchfab or ArtStation link (optional)
            widget: text
            required: false
            hint: "For the 3D background. Visitors can turn the model before they click the button. Paste the same kind of link as for a 3D model item. On a free Sketchfab account, Sketchfab's logo stays on the model."
            pattern: ['(sketchfab\.com/(3d-models/[^\s"''?#/]*-|models/)[0-9a-f]{32}|artstation\.com/embed/\d+)', "This isn't a Sketchfab model link or an ArtStation embed code. For ArtStation, copy the embed code under the 3D viewer, not the page link."]
          - { name: phones, label: Play the video or 3D model on phones too, widget: boolean, default: false, required: false, hint: "Off: phones show the picture instead, which loads faster and saves their battery." }
          - { name: title, label: Title (optional), required: false, hint: "Leave empty to show your name." }
          - { name: text, label: Text (optional), required: false, hint: "One line under the title. Leave empty to show your job title." }
          - { name: button, label: Button text, default: Enter, hint: "e.g. Enter, or See my work" }

      - name: profile
        label: Profile
        icon: person
        file: _data/profile.yml
        fields:
          - { name: first_name, label: First name }
          - { name: last_name, label: Last name }
          - { name: tagline, label: Job title, hint: "Shown next to your name at the top of every page, e.g. Game Developer" }
          - { name: email, label: Email, pattern: ['^[^@\s]+@[^@\s]+$', 'Must be an email address'], hint: All the email links on your site use this address. }
          - name: resume
            label: Résumé (PDF)
            widget: file
            accept: application/pdf,.pdf
            choose_url: false
            media_folder: /assets/doc
            public_folder: /assets/doc
            hint: Upload your résumé as a PDF. Every résumé link on your site opens this file.

      - name: hero
        label: Intro (top of page)
        icon: waving_hand
        file: _data/home/hero.yml
        fields:
          - { name: meta_title, label: Browser tab title, hint: "Shown on the browser tab and as your site's title in Google, e.g. Your Name — Game Developer" }
          - { name: meta_description, label: Share description, widget: text, hint: *share_hint }
          - name: share_image
            label: Share picture
            widget: image
            accept: image/jpeg,image/png,image/webp,image/avif
            choose_url: false
            hint: The preview picture shown when someone shares a link to your home page. A wide (landscape) picture works best.
          - name: title_lines
            label: Title lines
            label_singular: Line
            widget: list
            hint: "Short lines shown under your name, e.g. Game Developer · Tech Lead. To get the dot, copy it from here: ·"
            field: { name: line, label: Line }
          - { name: about, label: About me, widget: text, hint: "Leave an empty line between paragraphs. Formatting: `**two stars**` for **bold**, `*one star*` for *italic*, `[words](https://…)` for a link." }
          - &links
            name: links
            label: Links
            label_singular: Link
            widget: list
            summary: "{{fields.label}} ({{fields.kind}})"
            hint: "e.g. LinkedIn, GitHub, your email and your résumé."
            fields:
              - name: kind
                label: Link type
                widget: select
                default: link
                options:
                  - { label: Web address, value: link }
                  - { label: My email (the one in Profile), value: email }
                  - { label: My résumé (the PDF in Profile), value: resume }
              - { name: label, label: Link text, required: false, hint: "The words people click, e.g. LinkedIn. For email, leave empty to show the address itself." }
              - { name: url, label: Web address, required: false, hint: "Only for the Web address type. Copy it from your browser, e.g. https://www.linkedin.com/in/yourname" }

      - name: work_section
        label: Work section (heading)
        icon: grid_view
        file: _data/home/work.yml
        fields:
          - &sec_label { name: label, label: Small label, hint: Small highlighted label above the section heading. }
          - { name: heading, label: Heading, hint: "The project cards under this heading come from Projects." }
          - &sec_note { name: note, label: Note (optional), required: false, hint: "Small text to the right of the heading, e.g. Newest first." }

      - name: experience
        label: Experience
        icon: work_history
        file: _data/home/experience.yml
        fields:
          - *sec_label
          - &sec_heading { name: heading, label: Heading }
          - *sec_note
          - name: jobs
            label: Jobs
            label_singular: Job
            widget: list
            collapsed: true
            summary: "{{fields.company}} · {{fields.dates}}"
            hint: Newest first. Click a job to open it, and drag the ═ handle to change the order.
            fields:
              - { name: dates, label: Dates, hint: "e.g. Jan 2022 – present" }
              - { name: company, label: Company }
              - { name: location, label: Location, hint: "e.g. Stockholm, Sweden" }
              - name: roles
                label: Job titles
                label_singular: Job title
                widget: list
                hint: Add one line per title if you were promoted.
                field: { name: role, label: Job title, hint: "e.g. Lead Developer · Mar 2023 – present" }
              - name: bullets
                label: Bullet points
                label_singular: Bullet point
                widget: list
                field: { name: bullet, label: Bullet point, widget: text, hint: *fmt_short }
              - { name: highlight, label: Highlight, widget: boolean, default: false, required: false, hint: "Makes this job stand out, e.g. as a wider box. Good for your current job." }
          - name: education
            label: Education
            widget: object
            fields:
              - { name: dates, label: Dates, hint: "e.g. 2013 – 2017" }
              - { name: degree, label: Degree }
              - { name: school, label: School }
              - { name: note, label: Note (optional), required: false, hint: "e.g. Honours, a scholarship or your thesis topic" }

      - name: skills
        label: Skills
        icon: handyman
        file: _data/home/skills.yml
        fields:
          - *sec_label
          - *sec_heading
          - *sec_note
          - name: groups
            label: Skill groups
            label_singular: Group
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Group name, hint: "e.g. Engines & languages" }
              - { name: top, label: Main skills (highlighted), label_singular: Skill, widget: list, required: false, hint: "Your strongest skills in this group. They're shown first, highlighted.", field: { name: skill, label: Skill } }
              - { name: other, label: Other skills, label_singular: Skill, widget: list, required: false, field: { name: skill, label: Skill } }

      - name: about
        label: About
        icon: emoji_events
        file: _data/home/about.yml
        fields:
          - *sec_label
          - *sec_heading
          - name: boxes
            label: Boxes
            label_singular: Box
            widget: list
            summary: "{{fields.heading}}"
