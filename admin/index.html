<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Portfolio Admin</title>
</head>
<body>
  <!-- Sveltia CMS reads config.yml next to this file. -->
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
  <!-- Live preview of each page in the site's own theme (preview.js). -->
  <script src="preview.js"></script>
  <script>
    // On <user>.github.io/<repo>/admin/ (or <user>.github.io/admin/ for a user site), point the CMS
    // at that repository, so a fork works without editing config.yml. Anywhere else config.yml wins.
    (function () {
      var host = location.hostname.match(/^([\w-]+)\.github\.io$/i);
      var config = {};
      if (host) {
        var parts = location.pathname.split('/').filter(Boolean);
        var i = parts.indexOf('admin');
        var repo = i > 0 ? parts[0] : host[1] + '.github.io';
        var site = location.origin + '/' + (i > 0 ? parts[0] + '/' : '');
        config = { backend: { repo: host[1] + '/' + repo }, site_url: site, display_url: site };
      }
      CMS.init({ config: config });
    })();
  </script>
</body>
</html>
