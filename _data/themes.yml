# Themes offered under Look & feel in /admin. A theme is _includes/themes/<key>/ (frame.html,
# home.html, work.html) plus assets/css/<key>.css, and assets/js/<key>.js when `script` is true.
# `palette` and `fonts` are what "The theme's own" picks; `label` and `about` are shown on
# admin/looks.html. Keys must match admin/config.yml.
comic:
  label: Comic
  about: Slanted comic-book boxes with ink outlines, tilted labels and hard shadows. Bold and playful.
  palette: cobalt
  fonts: grotesk
  script: true
showcase:
  label: Showcase
  about: Your pictures and videos, big and edge to edge, with few words around them. Made for artists, animators and VFX.
  palette: night
  fonts: modern
editorial:
  label: Editorial
  about: Large type, thin rules and lots of space, like a magazine. Projects read as an index and case studies.
  palette: paper
  fonts: serif
