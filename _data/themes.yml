# Themes offered under Look & feel in /admin. A theme is _includes/themes/<key>/ (frame.html,
# home.html, work.html) plus assets/css/<key>.css, and assets/js/<key>.js when `script` is true.
# A theme script that draws on the page registers window.themeRefresh.<key>, a function the
# editor's live preview (admin/preview.js) calls after every redraw.
# `palette` and `fonts` are what "The theme's own" picks. Keys must match admin/config.yml.
showcase:
  palette: night
  fonts: modern
editorial:
  palette: paper
  fonts: serif
viewport:
  palette: graphite
  fonts: studio
  script: true
roadtrip:
  palette: roadtrip
  fonts: roadtrip
  script: true
