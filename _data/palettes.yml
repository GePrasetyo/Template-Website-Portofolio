# Colour presets offered under Theme in /admin. Keys must match admin/config.yml.
# Each has a light and a dark set; on_accent is the text colour on accent-coloured backgrounds.
cobalt:
  light: { background: "#f4f2ec", text: "#15151a", accent: "#2648d1", on_accent: "#ffffff" }
  dark: { background: "#141417", text: "#ecebe6", accent: "#7590ff", on_accent: "#0f1330" }
night:
  light: { background: "#f3f3f1", text: "#111113", accent: "#4d7c0f", on_accent: "#ffffff" }
  dark: { background: "#0b0b0c", text: "#f0f0ee", accent: "#c8f135", on_accent: "#141a02" }
paper:
  light: { background: "#faf7f2", text: "#1c1a17", accent: "#b3261e", on_accent: "#ffffff" }
  dark: { background: "#161412", text: "#ece7de", accent: "#ff8a7a", on_accent: "#2b0d09" }
forest:
  light: { background: "#eef0e8", text: "#142018", accent: "#1f7a4d", on_accent: "#ffffff" }
  dark: { background: "#0f1611", text: "#e3eae1", accent: "#5fd394", on_accent: "#06210f" }
tangerine:
  light: { background: "#fbf5ec", text: "#1c1712", accent: "#c2410c", on_accent: "#ffffff" }
  dark: { background: "#17120e", text: "#f0e8de", accent: "#fb923c", on_accent: "#2a1204" }
